{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ request.url_for('static', path='auth.css') }}">

<!-- Fullscreen overlay covering the standard app shell -->
<div class="premium-auth-layout">
  <section class="premium-auth-card">
    <div class="auth-header">
      <svg width="48" height="48" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
      </svg>
      <h1>Welcome to <br><span class="text-gradient">HITECH Reminder System</span></h1>
      <p>Enter your details to access your dashboard</p>
    </div>

    <form method="post" action="/login" class="auth-form-grid">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      
      <div class="auth-input-group">
        <label for="email">Email Address</label>
        <div class="auth-input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          <input type="email" id="email" name="email" autocomplete="username" required placeholder="you@example.com">
        </div>
      </div>
      
      <div class="auth-input-group">
        <label for="login-password">Password</label>
        <div class="auth-input-wrapper">
          <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
          <input type="password" name="password" id="login-password" autocomplete="current-password" required placeholder="••••••••">
          <button type="button" class="auth-password-toggle" onclick="const p = document.getElementById('login-password'); p.type = p.type === 'password' ? 'text' : 'password';" aria-label="Toggle password visibility">
            <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
          </button>
        </div>
      </div>
      
      <div class="auth-options">
        <label>
          <input type="checkbox" name="remember" value="true"> Remember me
        </label>
        <a href="/forgot-password">Forgot password?</a>
      </div>
      
      <button type="submit" class="auth-submit-btn">
        Login
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
      </button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="/signup">Sign up</a>
    </div>

    {% if unverified_email %}
    <div class="auth-verification">
      <p>Didn't receive the verification email?</p>
      <form method="post" action="/resend-verification">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <input type="hidden" name="email" value="{{ unverified_email }}">
        <button type="submit">Resend Verification Email</button>
      </form>
    </div>
    {% endif %}
  </section>
</div>

<script>
  // Enable full screen immersive auth mode by attaching class to body
  document.body.classList.add('auth-page');
</script>
{% endblock %}
