{% extends "base.html" %}

{% block content %}
<div class="page-content" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; text-align: center;">
    <svg width="120" height="120" fill="none" stroke="currentColor" stroke-width="1" viewBox="0 0 24 24" style="color: var(--primary); margin-bottom: 24px; opacity: 0.8;">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
    </svg>
    <h1 style="font-size: 4rem; font-weight: 800; margin-bottom: 8px; color: var(--text-main); line-height: 1;">404</h1>
    <h2 style="font-size: 1.5rem; font-weight: 600; margin-bottom: 16px; color: var(--text-main);">Page Not Found</h2>
    <p style="color: var(--text-muted); font-size: 1.1rem; max-width: 400px; margin-bottom: 32px;">The page you are looking for doesn't exist, has been moved, or is temporarily unavailable.</p>
    <a href="/" class="button primary hover-elevate">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
        Return to Dashboard
    </a>
</div>
{% endblock %}
