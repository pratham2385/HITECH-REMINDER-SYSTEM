{% extends "base.html" %}
{% block content %}

<div style="max-width: 600px; margin: 0 auto; padding-top: 24px;">
  <div class="panel" style="padding: 32px; background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.02); border: 1px solid var(--border-color);">
    
    <div style="margin-bottom: 24px; text-align: center;">
      <h2 style="font-size: 1.5rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px;">
        {% if collection %}Edit Collection{% else %}Create Collection{% endif %}
      </h2>
      <p style="color: var(--text-muted); font-size: 0.95rem; margin: 0;">
        {% if collection %}Update the details for {{ collection.name }}{% else %}Create a new workspace to group activities.{% endif %}
      </p>
    </div>

    <form method="post" action="{% if collection %}/collections/{{ collection.id }}/edit{% else %}/collections/new{% endif %}" style="display: flex; flex-direction: column; gap: 20px;">
      
      <!-- Form Group -->
      <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
        <label for="name" style="font-size: 0.85rem; font-weight: 600; color: var(--text-main);">Workspace Name <span style="color: #ef4444;">*</span></label>
        <input type="text" id="name" name="name" required value="{{ collection.name if collection else '' }}" placeholder="e.g. HR Activities 2026" style="width: 100%; padding: 12px 16px; background-color: var(--bg-app); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; color: var(--text-main); transition: all 0.2s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);">
      </div>

      <!-- Form Group -->
      <div class="form-group" style="display: flex; flex-direction: column; gap: 8px;">
        <label for="description" style="font-size: 0.85rem; font-weight: 600; color: var(--text-main);">Description</label>
        <textarea id="description" name="description" rows="4" placeholder="Optional description..." style="width: 100%; padding: 12px 16px; background-color: var(--bg-app); border: 1px solid var(--border-color); border-radius: var(--radius-md); font-size: 1rem; color: var(--text-main); transition: all 0.2s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.02); resize: vertical;">{{ collection.description if collection else '' }}</textarea>
      </div>

      <!-- Action Buttons -->
      <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 12px; padding-top: 20px; border-top: 1px solid var(--border-color);">
        <a href="/collections" class="button outline" style="padding: 10px 20px; font-weight: 600;">Cancel</a>
        <button type="submit" class="button primary" style="padding: 10px 24px; font-weight: 600; box-shadow: 0 4px 12px rgba(15, 124, 112, 0.25);">
          {% if collection %}Save Changes{% else %}Create Collection{% endif %}
        </button>
      </div>

    </form>
  </div>
</div>

{% endblock %}
