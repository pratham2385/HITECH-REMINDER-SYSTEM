{% extends "base.html" %}
{% block content %}

<!-- Hero Section & Quick Actions -->
<section class="panel hero-section" style="display: flex; justify-content: space-between; align-items: center; background: linear-gradient(135deg, var(--bg-surface) 0%, var(--primary-light) 100%); border-left: 4px solid var(--accent); flex-wrap: wrap; gap: 16px;">
  <div>
    <h1 style="font-size: 1.5rem; margin-bottom: 4px; color: var(--text-main);">Welcome back, {{ user.display_name }}!</h1>
    <p style="color: var(--text-muted); margin: 0;">Here's what's happening today, {{ today.strftime("%d %B %Y") }}.</p>
  </div>
  {% if user.can_edit %}
    <div class="quick-actions" style="display: flex; gap: 12px; flex-wrap: wrap;">
      <a href="/activities/new" class="button primary">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"></path></svg>
        New Activity
      </a>
      <a href="/settings/email" class="button ghost">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
        Settings
      </a>
    </div>
  {% endif %}
</section>

<!-- HTMX Live Monitor Container -->
<div id="live-monitor-container" hx-get="/dashboard/monitor" hx-trigger="load, every 30s" hx-swap="innerHTML">
  <!-- Content will be injected by dashboard_monitor.html -->
</div>

<!-- Modern Charts -->
<section class="two-column">
  <div class="panel">
    <div class="panel-head">
      <h2 style="font-size: 1.125rem;">Delivery Volume</h2>
      <span class="status-badge" style="background: var(--bg-surface-hover); border: 1px solid var(--border-color); padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem;">Last 6 Months</span>
    </div>
    <div class="chart-container" style="position: relative; height:250px; width:100%">
      <canvas id="chart-emails-month"></canvas>
    </div>
  </div>
  <div class="panel">
    <div class="panel-head">
      <h2 style="font-size: 1.125rem;">Success Rate</h2>
      <span class="status-badge" style="background: var(--success-light); color: var(--success); padding: 4px 10px; border-radius: var(--radius-full); font-size: 0.75rem; font-weight: 600;">Healthy</span>
    </div>
    <div class="chart-container" style="position: relative; height:250px; width:100%; display:flex; justify-content:center;">
      <canvas id="chart-success-rate"></canvas>
    </div>
  </div>
</section>

<!-- Inject server data to client -->
<script>
  window.CHART_MONTHS_LABELS = JSON.parse('{{ chart_months_labels|safe }}');
  window.CHART_MONTHS_DATA = JSON.parse('{{ chart_months_data|safe }}');
  window.CHART_SUCCESS_DATA = JSON.parse('{{ chart_success_data|safe }}');
</script>

<!-- Include Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{% endblock %}
