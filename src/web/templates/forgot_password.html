{% extends "base.html" %}
{% block content %}
<link rel="stylesheet" href="{{ request.url_for('static', path='auth.css') }}">

<div class="premium-auth-layout">
  
  <!-- Left Side: Branding Panel -->
  <div class="auth-branding-panel">
    <div class="auth-branding-content">
      <div class="auth-logo">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
        HITECH Auth
      </div>
      
      <!-- Typewriter Title -->
      <h1 id="typewriter-title" class="typewriter-title"></h1>
      
      <!-- Daily Quote Container -->
      <div id="daily-quote-container" class="daily-quote-container">
        <!-- JS injects quote here -->
      </div>
    </div>
  </div>

  <!-- Right Side: Form Panel -->
  <div class="auth-form-panel">
    <section class="premium-auth-card">
      <div class="auth-header">
        <h1>Forgot Password</h1>
        <p>Enter your email and we will send you a reset link.</p>
      </div>

      <form method="post" action="/forgot-password" class="auth-form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        
        <div class="auth-input-group">
          <label for="email">Email Address</label>
          <div class="auth-input-wrapper">
            <svg class="icon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
            <input type="email" id="email" name="email" required placeholder="you@example.com">
          </div>
        </div>
        
        <button type="submit" class="auth-submit-btn">
          Send Reset Link
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
        </button>
      </form>

      <div class="auth-footer">
        Remember your password? <a href="/login">Login</a>
      </div>
    </section>
  </div>
</div>

<script src="{{ request.url_for('static', path='js/auth_enhancements.js') }}"></script>
<script>
  document.body.classList.add('auth-page');
</script>
{% endblock %}
